const { useState, useMemo, useEffect, useRef } = React;

// House writing style for every post and caption: no dash-heavy punctuation
// and no divider lines, which read as AI-generated on LinkedIn.
const POST_STYLE = `WRITING STYLE (strict):
- Do NOT use em dashes (—) or en dashes (–), and do not use a hyphen as punctuation between clauses. Use a comma, a period, or a new sentence instead.
- Do NOT add divider or separator lines (---, ___, ———, ━━━, ═══ or similar).
- Do NOT start lines with a dash or hyphen as a bullet. If a list is needed, use numbers or a fitting emoji.
- Hyphens are only allowed inside normal compound words (e.g. "follow-up", "full-time").`;

// Safety net after generation: turns stray dash punctuation into commas and
// drops divider lines and dash bullets the model added anyway.
function cleanPostText(text) {
  return String(text || "")
    .split("\n")
    .filter((line) => !/^\s*([-_=~*\u2014\u2013\u2500-\u257F]\s*){3,}$/.test(line))
    .map((line) => line.replace(/^(\s*)[-\u2013\u2014]\s+/, "$1"))
    .join("\n")
    .replace(/\s*[\u2014\u2013]\s*/g, ", ")
    .replace(/ +- +/g, ", ")
    .replace(/,\s*([.,!?;:])/g, "$1")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

// Quick actions offered when text is highlighted inside an editable field.
const SELECTION_ACTIONS = [
  { id: "rewrite", label: "Rewrite", ask: "Rewrite it in a fresh way with the same meaning." },
  { id: "improve", label: "Improve", ask: "Improve it: clearer, stronger, more compelling, same meaning." },
  { id: "shorter", label: "Shorter", ask: "Make it noticeably shorter without losing the point." },
  { id: "longer", label: "Expand", ask: "Expand it with a little more detail or explanation, staying factual." },
  { id: "punchier", label: "Punchier", ask: "Make it punchier and more direct, with short sentences." },
  { id: "pro", label: "More professional", ask: "Make the tone more professional and polished." },
  { id: "friendly", label: "Friendlier", ask: "Make the tone warmer and more conversational." },
  { id: "hook", label: "Make it a hook", ask: "Turn it into a scroll-stopping opening hook of one or two short lines." },
  { id: "bullets", label: "Bullet points", ask: "Turn it into a short list of bullet points, one per line, each starting with a fitting emoji." },
  { id: "emoji", label: "Add emoji", ask: "Add one to three fitting emoji, without changing the words much." },
  { id: "grammar", label: "Fix grammar", ask: "Fix spelling, grammar and punctuation only. Change nothing else." },
];

async function transformSelection({ selected, fullText, ask, kind, niche }) {
  const prompt = `You are editing part of a ${kind}${niche ? ` for the niche "${niche}"` : ""}. The FULL TEXT is given only for context. Change ONLY the SELECTED PART as instructed, so it still fits smoothly where it sits in the full text. Never invent facts, numbers, names or client stories.

INSTRUCTION: ${ask}

FULL TEXT (context only):
"""${fullText}"""

SELECTED PART:
"""${selected}"""

${/LinkedIn/.test(kind) ? POST_STYLE : "Do not use em dashes (\u2014) or en dashes (\u2013); use commas or periods instead."}

Respond with ONLY the replacement for the selected part: no quotes, no preamble, no notes, no markdown.`;
  const out = await callClaudeText([{ type: "text", text: prompt }], { model: "claude-haiku-4-5-20251001", max_tokens: 1200 });
  if (!out) throw new Error("The AI returned nothing.");
  const clean = out.replace(/^"""|"""$/g, "");
  return /LinkedIn/.test(kind) ? cleanPostText(clean) : clean.replace(/\s*[\u2014\u2013]\s*/g, ", ");
}

// A textarea that grows with its content, so generated text can be edited in
// place and still reads like the page around it. Highlighting text inside it
// opens a menu of AI actions that rewrite just the highlighted part.
function EditableText({ value, onChange, fontSize = 14, aiKind = "LinkedIn post", aiNiche = "" }) {
  const ref = useRef(null);
  const menuRef = useRef(null);
  const [sel, setSel] = useState(null);
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const [custom, setCustom] = useState("");
  const [undo, setUndo] = useState(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }, [value]);

  const readSelection = () => {
    const el = ref.current;
    if (!el) return;
    const { selectionStart: a, selectionEnd: b } = el;
    if (b > a && el.value.slice(a, b).trim()) { setSel({ a, b }); setErr(""); }
    else if (!busy) setSel(null);
  };

  const apply = async (id, ask) => {
    if (!sel || busy) return;
    const text = value || "";
    const selected = text.slice(sel.a, sel.b);
    setBusy(id);
    setErr("");
    try {
      const out = await transformSelection({ selected, fullText: text, ask, kind: aiKind, niche: aiNiche });
      setUndo(text);
      onChange(text.slice(0, sel.a) + out + text.slice(sel.b));
      setSel(null);
      setCustom("");
    } catch (e) {
      setErr(`Couldn't do that (${e.message}).`);
    } finally {
      setBusy("");
    }
  };

  // Clicking the menu must not take focus (and the highlight) from the text.
  const keep = (e) => { if (e.target.tagName !== "INPUT") e.preventDefault(); };
  const chip = (active) => ({
    padding: "5px 10px", borderRadius: 14, border: `1px solid ${active ? BRASS : "#D8D0BC"}`, background: active ? BRASS : "#fff",
    color: active ? PAPER : INK, fontFamily: "'Courier New', monospace", fontSize: 11.5, cursor: busy ? "default" : "pointer", whiteSpace: "nowrap",
  });

  return (
    <div>
      {sel && (
        <div ref={menuRef} onMouseDown={keep} style={{ background: "#FBF9F4", border: "1px solid #E5DFD0", borderRadius: 8, padding: 8, marginBottom: 8, fontFamily: "'Courier New', monospace" }}>
          <div style={{ fontSize: 11, color: "#8A8272", marginBottom: 6 }}>
            {busy ? "Working on the highlighted text..." : `Highlighted ${(value || "").slice(sel.a, sel.b).trim().split(/\s+/).length} word(s) — choose what to do:`}
          </div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {SELECTION_ACTIONS.map((x) => (
              <button key={x.id} onMouseDown={keep} onClick={() => apply(x.id, x.ask)} disabled={!!busy} style={chip(busy === x.id)}>
                {busy === x.id ? "..." : x.label}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
            <input
              value={custom}
              onChange={(e) => setCustom(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && custom.trim()) apply("custom", custom.trim()); }}
              onBlur={(e) => { if (!busy && e.relatedTarget !== ref.current && !(menuRef.current && menuRef.current.contains(e.relatedTarget))) setSel(null); }}
              placeholder="Or tell the AI what to do with it..."
              style={{ flex: 1, minWidth: 0, padding: "6px 8px", borderRadius: 6, border: "1px solid #D8D0BC", fontSize: 12, background: "#fff", color: INK }}
            />
            <button onClick={() => custom.trim() && apply("custom", custom.trim())} disabled={!!busy || !custom.trim()} style={chip(busy === "custom")}>
              {busy === "custom" ? "..." : "Apply"}
            </button>
          </div>
          {err && <div style={{ color: RISK, fontSize: 11.5, marginTop: 6 }}>{err}</div>}
        </div>
      )}
      <textarea
        ref={ref}
        value={value || ""}
        onChange={(e) => { onChange(e.target.value); setUndo(null); }}
        onSelect={readSelection}
        onMouseUp={readSelection}
        onKeyUp={readSelection}
        onBlur={(e) => { if (!busy && !(menuRef.current && menuRef.current.contains(e.relatedTarget))) setSel(null); }}
        spellCheck
        style={{
          width: "100%", border: "none", outline: "none", resize: "none", overflow: "hidden",
          background: "transparent", color: INK, fontFamily: "inherit", fontSize, lineHeight: 1.6, padding: 0, display: "block",
        }}
      />
      {undo !== null && (
        <button onClick={() => { onChange(undo); setUndo(null); }} style={{ marginTop: 6, background: "none", border: "none", padding: 0, color: BRASS, fontFamily: "'Courier New', monospace", fontSize: 11.5, cursor: "pointer", textDecoration: "underline" }}>
          Undo AI change
        </button>
      )}
    </div>
  );
}

// useState that survives closing the app by mirroring the value into this
// browser's localStorage. Storage can be blocked (private mode, quota), so
// every access is guarded and the app still works without it.
function usePersisted(key, initial) {
  const [value, setValue] = useState(() => {
    try {
      const raw = localStorage.getItem("leaddesk:" + key);
      return raw === null ? initial : JSON.parse(raw);
    } catch (e) {
      return initial;
    }
  });
  useEffect(() => {
    try { localStorage.setItem("leaddesk:" + key, JSON.stringify(value)); } catch (e) {}
  }, [key, value]);
  return [value, setValue];
}

const HISTORY_LIMIT = 50;

// Merges two saved lists by id (newest edit wins) and drops anything deleted
// on either device, so syncing never loses work from one side.
function mergeById(a, b, deleted) {
  const gone = new Set(deleted || []);
  const stamp = (x) => x.updatedAt || x.savedAt || x.id || 0;
  const byId = new Map();
  [...(a || []), ...(b || [])].forEach((x) => {
    if (!x || gone.has(x.id)) return;
    const cur = byId.get(x.id);
    if (!cur || stamp(x) > stamp(cur)) byId.set(x.id, x);
  });
  return [...byId.values()].sort((x, y) => y.id - x.id).slice(0, HISTORY_LIMIT * 4);
}

// ---- Persistent memory -------------------------------------------------
// Standing notes (apply to every reply) and per-client profiles (notes +
// saved conversation thread). Lives in localStorage under "leaddesk:memory"
// and can be exported/imported as JSON to move between devices.
const EMPTY_MEMORY = { notes: [], clients: {} };
const clientKey = (name) => (name || "").trim().toLowerCase().replace(/\s+/g, " ");

function memoryPrompt(memory, clientName) {
  const parts = [];
  const notes = ((memory && memory.notes) || []).map((n) => n.text).filter(Boolean);
  if (notes.length) parts.push(`STANDING NOTES FROM ERIKA (always respect these; they override defaults):\n${notes.map((t) => `- ${t}`).join("\n")}`);
  const c = memory && memory.clients && memory.clients[clientKey(clientName)];
  if (c && c.notes && c.notes.trim()) parts.push(`WHAT WE KNOW ABOUT THIS CLIENT (${c.name}):\n${c.notes.trim()}`);
  return parts.join("\n\n");
}

function formatSavedAt(ts) {
  return new Date(ts).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

// Cross-browser copy: use the async Clipboard API when available (needs a
// secure context), otherwise fall back to a hidden textarea + execCommand so
// copy still works on older or non-HTTPS mobile browsers.
function copyText(text) {
  const value = text || "";
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(value).catch(() => fallbackCopy(value));
  }
  return Promise.resolve(fallbackCopy(value));
}

function fallbackCopy(value) {
  try {
    const ta = document.createElement("textarea");
    ta.value = value;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  } catch (e) {
    /* nothing else we can do */
  }
}

// Distilled from Erika's real message history — used as the system prompt so replies
// are genuinely drafted for what the client wrote, not picked from a fixed list.
// Hard facts and policies pulled from Erika's real messages. The model must
// never invent numbers or promises outside this set — it grounds accuracy.
const PLAYBOOK = `FACTS AND POLICIES (never contradict or invent beyond these):
- Pricing: Resume only $120. Resume + LinkedIn $180. Resume + Cover Letter + LinkedIn (complete package) $220. Alternate tiers seen: Basic (resume) $120, Standard (resume + cover letter) $150, Premium (resume + cover letter + LinkedIn) $180. Two resumes + two cover letters $300, often discounted to $250. Only offer a discount if the client raises budget; typical discounts $20-$100.
- Payment: full payment upfront before any work begins. Invoice is sent to the client's email. Payment processor is UK-based; international fees may apply and should be disclosed on the invoice.
- Turnaround: usually stated as 4 to 7 business days (varies by workload); can expedite to same-day or a named day when the client is in a hurry.
- Revisions: up to two revisions after the initial draft (occasionally up to four). Guarantees 100% customer satisfaction and a refund policy for protection.
- Communication: messaging only (LinkedIn or email). Does NOT do phone calls or phone consultations, ever. Reason given: she references written requirements more accurately than spoken ones.
- Delivery: documents sent in both DOC/Word and PDF formats so the client can edit them later.
- LinkedIn optimization: she provides a document with the recommended changes; the client copies and pastes it into their own profile. It improves headline, summary/About, and experience keywords to raise visibility, search appearances, and ranking. It is organic and works best with the client's consistent engagement.
- Resume formats she recommends: combination format for experienced/executive professionals; functional format to handle career gaps or thin chronological history (e.g. long gaps, part-time/volunteer work).
- ATS: an Applicant Tracking System scans, organizes, and ranks resumes against the job description. A resume "meets ATS standards" when formatting, keywords, and standard section titles let the software read and rank it.
- Scope limits: resume service is for US and Canada only (she is not versed in other countries' ATS requirements) and she declines work outside that politely, referring them elsewhere.

// Returns { detectedStage, reasoning, drafts: [strings] }. Auto-detects the
// situation from the message unless a specific stage is forced, writes fresh
// replies in Erika's voice, and can take the prior thread for context.
async function generateAIResponse({ clientMessage, thread, forcedStageLabel, clientName, extraContext, tone, variants = 3, model }) {
  const stageMap = SITUATIONS.filter((s) => s.id !== "auto").map((s) => `${s.id}: ${s.label}`).join("\n");

  const task = `TASK
1. Read the conversation and the client's latest message.
2. Detect which stage of Erika's workflow this is (choose the closest id from the list below).
3. Write ${variants} distinct reply options for the latest message, each fully in Erika's voice, each a complete reply she could send as-is. Vary the phrasing and structure between options, not the meaning. Address exactly what the client actually said; do not raise topics they didn't. Do not add a subject line.

STAGE OPTIONS:
${stageMap}
${forcedStageLabel ? `\nThe user has forced this stage: "${forcedStageLabel}". Use it as the intent even if the message is ambiguous.` : ""}
${clientName ? `\nClient's name: ${clientName}. You may open with it naturally.` : ""}
${extraContext ? `\n${extraContext}` : ""}
${tone && TONE_INSTRUCTION[tone] ? `\nTONE: ${TONE_INSTRUCTION[tone]}` : ""}

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{"detectedStage": "one stage id from the list", "reasoning": "one short sentence on why", "drafts": ["reply option 1", "reply option 2", "reply option 3"]}`;

  const convo = (Array.isArray(thread) && thread.length)
    ? `CONVERSATION SO FAR (oldest first):\n${thread.map((t) => `${t.role === "me" ? "Erika" : "Client"}: ${t.text}`).join("\n")}\n\n`
    : "";

  const userPrompt = `${convo}CLIENT'S LATEST MESSAGE:\n"""${clientMessage}"""\n\n${task}`;

  const res = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: model || "claude-sonnet-4-6",
      max_tokens: 1500,
      system: VOICE_SYSTEM_PROMPT,
      messages: [{ role: "user", content: userPrompt }],
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Request failed (${res.status})`);
  }
  const data = await res.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n")
    .trim();
  if (!text) throw new Error("Empty response");
  const clean = text.replace(/```json|```/g, "").trim();
  let parsed;
  try {
    parsed = JSON.parse(clean);
  } catch {
    // Fallback: treat the whole thing as a single draft so the user still gets something.
    return { detectedStage: "", reasoning: "", drafts: [text] };
  }
  const drafts = Array.isArray(parsed.drafts) ? parsed.drafts.filter((d) => d && d.trim()) : [];
  if (!drafts.length) throw new Error("Empty response");
  return { detectedStage: parsed.detectedStage || "", reasoning: parsed.reasoning || "", drafts };
}

async function generatePostFromClaude({ task, niche, keywords, formatPref, captionType, sourceText, contextNote, imageBase64, imageMediaType }) {
  const keywordLine = keywords ? `Also naturally weave in these target keywords so they read as exact or near-exact phrases (for search/discovery relevance, not stuffed): ${keywords}. Note briefly how you reinforced them.` : "";

  let instructions;
  if (task === "caption") {
    instructions = `You are a LinkedIn ghostwriter for a service provider in the niche "${niche}". Write the caption that goes in the share box above this ${captionType || "image post"} (the graphic/content is given below as an image and/or notes). The caption's job is to stop the scroll and get people to open, read, or engage with it — it should NOT repeat everything already on the graphic.

Caption rules:
- First line is a scroll-stopping hook (it's all people see before "...see more").
- 3-8 short lines with line breaks; first person, warm, conversational, specific to what's in the content.
- Tease the value inside (e.g. "5 questions that tell you if your resume is costing you interviews") without giving it all away.
- End with a clear call to action fitting a ${captionType || "image post"} (e.g. read the full edition, answer in the comments, subscribe, DM).
- 3 relevant hashtags max at the end.
${keywordLine}
${contextNote ? `Extra context from the user: ${contextNote}` : ""}

Write 3 genuinely different options (e.g. question hook, bold statement hook, personal story hook).

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{"format": "what the content is, e.g. Newsletter: Quick Resume Gut-Check", "why": "1 sentence on the angle you took", "keywordNote": "1 sentence on keywords, or empty string if none given", "rewritten": "caption option 1 (strongest)", "alternatives": ["caption option 2", "caption option 3"]}`;
  } else if (task === "rewrite") {
    instructions = `You are a LinkedIn content strategist. Analyze the ORIGINAL POST (given as text or an image below), identify its viral format/hook pattern (e.g. before/after story, contrarian hot take, curated list, quantified result), briefly explain why that pattern works, then rewrite the post so it fits the niche of "${niche}" while keeping the same structural pattern and emotional hook.

${keywordLine}
${contextNote ? `Extra context from the user: ${contextNote}` : ""}

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{"format": "short format label", "why": "1-2 sentence explanation of why this pattern works", "keywordNote": "1 sentence on how keywords were woven in, or empty string if none given", "rewritten": "the full rewritten post ready to publish, in the target niche"}`;
  } else {
    instructions = `You are a LinkedIn content strategist for the niche "${niche}". The user wants a brand new post built around the topic, story, client review, or photo given below (not a rewrite of an existing viral post). Pick the strongest viral format for this material${formatPref ? ` \u2014 the user prefers: ${formatPref}` : " (before/after story, contrarian hot take, curated list, or quantified result \u2014 whichever fits the material best)"}, explain briefly why that format suits this material, then write the full post.

${keywordLine}
${contextNote ? `Extra context from the user: ${contextNote}` : ""}

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{"format": "short format label", "why": "1-2 sentence explanation of why this format fits this material", "keywordNote": "1 sentence on how keywords were woven in, or empty string if none given", "rewritten": "the full new post ready to publish"}`;
  }

  const content = [];
  if (imageBase64) {
    content.push({ type: "image", source: { type: "base64", media_type: imageMediaType, data: imageBase64 } });
    content.push({ type: "text", text: instructions + (sourceText ? `\n\nUser's notes about the photo/topic:\n"""${sourceText}"""` : "") });
  } else {
    const label = task === "rewrite" ? "ORIGINAL POST" : task === "caption" ? "WHAT THE CONTENT IS ABOUT" : "TOPIC / STORY / REVIEW";
    content.push({ type: "text", text: instructions + `\n\n${label}:\n"""${sourceText}"""` });
  }

  content[content.length - 1].text += `\n\n${POST_STYLE}\nThese style rules apply to every post or caption you write inside the JSON.`;
  const result = await callClaudeJSON(content, { model: "claude-haiku-4-5-20251001", max_tokens: task === "caption" ? 1500 : 1000 });

  if (Array.isArray(result.alternatives)) result.alternatives = result.alternatives.map(cleanPostText);
  return result;
}

async function callClaudeText(content, { model = "claude-sonnet-4-6", max_tokens = 2000 } = {}) {
  const res = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model, max_tokens, messages: [{ role: "user", content }] }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Request failed (${res.status})`);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error.message || data.error);
  return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
}

// Pulls the JSON object out of a reply even if the model wraps it in fences
// or a sentence of preamble.
async function callClaudeJSON(content, opts) {
  const text = await callClaudeText(content, opts);
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start === -1 || end <= start) throw new Error("The AI reply wasn't in the expected format.");
  return JSON.parse(text.slice(start, end + 1));
}

const DOC_ISSUE_TYPES = {
  spelling: { label: "Spelling", color: "#9C3B3B" },
  grammar: { label: "Grammar", color: "#B4532A" },
  punctuation: { label: "Punctuation", color: "#8A6A1F" },
  clarity: { label: "Clarity", color: "#2F6690" },
  style: { label: "Style", color: "#6B4C9A" },
  consistency: { label: "Consistency", color: "#3F6B4F" },
  goal: { label: "Goal", color: "#1E2530" },
};
const DOC_CHUNK = 9000;

// Splits long documents on paragraph breaks so each AI pass stays reliable.
function splitDocument(text) {
  const paras = text.split(/(\n\s*\n)/);
  const chunks = [];
  let cur = "";
  paras.forEach((p) => {
    if (cur.length + p.length > DOC_CHUNK && cur.trim()) { chunks.push(cur); cur = ""; }
    cur += p;
  });
  if (cur.trim()) chunks.push(cur);
  return chunks;
}

async function checkDocumentPart({ part, index, total, goal, docType, tone }) {
  const text = `You are a meticulous professional editor. Review the document ${total > 1 ? `PART ${index + 1} of ${total}` : "below"}.
Document type: ${docType || "general document"}. Desired tone: ${tone || "keep the author's tone"}.
What the author wants to achieve with this document: ${goal ? `"""${goal}"""` : "not stated"}

Find every real issue: spelling, grammar, punctuation, word choice and clarity, consistency (tense, names, numbers, formatting), style (wordiness, repetition, passive voice where it weakens the text), and "goal" issues (sentences that work against what the author wants to achieve, or a missing point the goal needs).
Rules:
- "original" must be copied EXACTLY, character for character, from the document: only the words that change, plus a few neighbouring words if needed to make it unique. Never paraphrase it.
- "suggestion" is the exact replacement text for "original". For a missing-point goal issue, quote the sentence after which it belongs and give that sentence plus the addition.
- Keep the author's voice and meaning. Never invent facts. Do not flag text that is already correct.
- Do not use em dashes in suggestions.
- "why" is one short sentence.

Respond ONLY with valid JSON, no markdown fences, in this exact shape:
{"summary": "${index === 0 ? "2-3 sentences: overall quality and the biggest problems" : ""}", "goalScore": ${index === 0 ? "0-100 how well the document serves the stated goal (or null if no goal)" : "null"}, "goalNotes": [${index === 0 ? '"up to 4 short notes on how to better achieve the goal"' : ""}], "issues": [{"type": "spelling|grammar|punctuation|clarity|style|consistency|goal", "original": "exact text", "suggestion": "replacement", "why": "short reason"}]}

DOCUMENT${total > 1 ? ` PART ${index + 1}` : ""}:
"""${part}"""`;
  return callClaudeJSON([{ type: "text", text }], { max_tokens: 6000 });
}

// Places each pending issue on the text (first unclaimed match, in order) and
// returns render segments plus which issues could not be found any more.
function layoutIssues(text, issues) {
  const ranges = [];
  const missing = new Set();
  issues.filter((x) => x.status === "pending").forEach((x) => {
    let from = 0, at = -1;
    while ((at = text.indexOf(x.original, from)) !== -1) {
      const end = at + x.original.length;
      if (!ranges.some((r) => at < r.end && end > r.start)) break;
      from = at + 1;
    }
    if (at === -1 || !x.original) missing.add(x.id);
    else ranges.push({ start: at, end: at + x.original.length, issue: x });
  });
  ranges.sort((a, b) => a.start - b.start);
  const segs = [];
  let pos = 0;
  ranges.forEach((r) => {
    if (r.start > pos) segs.push({ text: text.slice(pos, r.start) });
    segs.push({ text: text.slice(r.start, r.end), issue: r.issue });
    pos = r.end;
  });
  if (pos < text.length) segs.push({ text: text.slice(pos) });
  return { segs, missing };
}

function verdict(score, max) {
  const pct = max ? score / max : 0;
  if (pct >= 0.55) return { text: "Looks likely fake or low-value — verify before spending time", color: RISK, glyph: "⚠" };
  if (pct >= 0.25) return { text: "Mixed signals — worth a quick clarifying question first", color: CAUTION, glyph: "?" };
  return { text: "Looks like a real, worthwhile lead", color: SAFE, glyph: "✓" };
}

  const copyPostResult = () => {

  const maxScore = SIGNALS.reduce((s, f) => s + Math.max(...f.options.map((o) => o.pts)), 0);
  const score = SIGNALS.reduce((s, f) => {

  const answeredAll = SIGNALS.every((f) => signals[f.id]);

  const ADDON_DESC = {
    cover: "a tailored cover letter",

  };

  const proposal = useMemo(() => {
    const L = LEVEL_VOICE[level];

    const greeting = `Hi ${capitalizedName || "[Name]"},`;

    const basePrice = (level === "manager" || level === "senior") ? 120 : 60;

  const copyProposal = () => {

  const response = useMemo(() => {

  const copyResponse = () => {

  // Generate draft replies for the latest client turn, given the prior thread.
  const genDrafts = async (thread, clientMessage) => {
    setAiLoading(true);
    setAiError("");
    try {
      const mem = memoryPrompt(memory, respClientName);
      const extraContext = `Pricing tiers if pricing comes up: Resume only $${respP1}, Resume + LinkedIn $${respP2}, Complete package $${respP3}.${mem ? `\n\n${mem}` : ""}`;
      const result = await generateAIResponse({
        clientMessage,

        clientName: respClientName,

  // Add the client's new message to the thread and draft replies to it.
  const submitClientMsg = () => {
    const msg = pastedClientMsg.trim();

    }

    setAiDrafts([]);

  // Re-draft options for the last (still-unanswered) client message.
  const regenerateDrafts = () => {
    if (!convo.length || convo[convo.length - 1].role !== "client") return;
    genDrafts(convo.slice(0, -1), convo[convo.length - 1].text);

  // Pick one draft as the reply you send: add it to the thread and copy it.
  const pickDraft = (idx) => {
    const chosen = aiDrafts[idx];
    copyText(chosen);

    setAiDrafts([]);

  const updateClientNotes = (k, notes) => setMemory((m) => ({ ...m, clients: { ...m.clients, [k]: { ...m.clients[k], notes, updatedAt: Date.now() } } }));

  const importMemory = (file) => {

      setMemory((m) => ({ notes: [...(m.notes || []), ...d.notes.filter((n) => !(m.notes || []).some((x) => x.id === n.id))], clients: { ...(m.clients || {}), ...d.clients } }));

  // ---- Cloud sync (Supabase via /api/memory) ----

  // memory up; otherwise the cloud copy wins. After that, every change is saved
  // back (debounced).
  useEffect(() => {
    if (!syncKey) { setSyncReady(false); return; }
    let cancelled = false;
    setSyncStatus("loading");
    fetch("/api/memory", { headers: { "x-desk-key": syncKey } })
      .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || `Sync failed (${r.status})`); return d; })
      .then((d) => {
        if (cancelled) return;
        if (d.data && Array.isArray(d.data.notes)) setMemory(d.data);
        setSyncReady(true);
        setSyncStatus("saved");
      })
      .catch((e) => { if (!cancelled) { setSyncReady(false); setSyncStatus(e.message); } });
    return () => { cancelled = true; };
  }, [syncKey]);

  useEffect(() => {
    if (!syncKey || !syncReady) return;
    setSyncStatus("saving");
    const t = setTimeout(() => {
      fetch("/api/memory", { method: "PUT", headers: { "Content-Type": "application/json", "x-desk-key": syncKey }, body: JSON.stringify({ data: memory }) })
        .then(async (r) => { if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || `Sync failed (${r.status})`); } setSyncStatus("saved"); })
        .catch((e) => setSyncStatus(e.message));
    }, 1200);
    return () => clearTimeout(t);
  }, [memory, syncReady]);

  const resetConvo = () => {
    setConvo([]);
    setAiDrafts([]);
    setPastedClientMsg("");
    setAiDetected("");
    setAiReasoning("");
    setAiError("");
  };

  const [rvName, setRvName] = usePersisted("rvName", "");
  const [rvTarget, setRvTarget] = usePersisted("rvTarget", "");
  const [rvMode, setRvMode] = useState("file");
  const [rvText, setRvText] = useState("");
  const [rvPdf, setRvPdf] = useState(null);
  const [rvFileName, setRvFileName] = useState("");
  const [rvLoading, setRvLoading] = useState(false);
  const [rvError, setRvError] = useState("");
  const [rvResult, setRvResult] = usePersisted("rvResult", null);
  const [rvCopied, setRvCopied] = useState(false);
  const [savedReviews, setSavedReviews] = usePersisted("savedReviews", []);

  // ---- Document checker state ----
  const [docTitle, setDocTitle] = usePersisted("docTitle", "");
  const [docType, setDocType] = usePersisted("docType", "Business document");
  const [docTone, setDocTone] = usePersisted("docTone", "Keep my tone");
  const [docGoal, setDocGoal] = usePersisted("docGoal", "");
  const [docText, setDocText] = usePersisted("docText", "");
  const [docIssues, setDocIssues] = usePersisted("docIssues", []);
  const [docLog, setDocLog] = usePersisted("docLog", []);
  const [docReport, setDocReport] = usePersisted("docReport", null);
  const [docId, setDocId] = usePersisted("docId", null);
  const [savedDocs, setSavedDocs] = usePersisted("savedDocs", []);
  const [docView, setDocView] = useState("review");
  const [docFilter, setDocFilter] = useState("all");
  const [docActive, setDocActive] = useState(null);
  const [docBusy, setDocBusy] = useState("");
  const [docError, setDocError] = useState("");
  const [docCopied, setDocCopied] = useState(false);
  const docEditStart = useRef(null);

  // Keep the document and the suggestion list pointing at the same issue:
  // selecting either one scrolls the other into view.
  useEffect(() => {
    if (!docActive) return;
    const t = setTimeout(() => {
      const hl = document.querySelector(`[data-hl="${docActive}"]`);
      const card = document.querySelector(`[data-card="${docActive}"]`);
      if (hl) hl.scrollIntoView({ block: "center", behavior: "smooth" });
      // Scroll the side panel itself, so it doesn't cancel the page scroll above.
      const side = card && card.closest(".doc-side");
      if (side && getComputedStyle(side).position === "sticky") {
        const top = card.offsetTop - side.clientHeight / 3;
        side.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
      }
    }, 30);
    return () => clearTimeout(t);
  }, [docActive]);

  const logDoc = (entry) => setDocLog((l) => [{ id: Date.now() + Math.random(), at: Date.now(), ...entry }, ...l].slice(0, 300));

  const loadDocFile = (file) => {
    if (!file) return;
    setDocError("");
    if (!docTitle) setDocTitle(file.name.replace(/\.[^.]+$/, ""));
    const reader = new FileReader();
    if (/\.docx$/i.test(file.name)) {
      reader.onload = () => window.mammoth.extractRawText({ arrayBuffer: reader.result })
        .then((r) => { setDocText(r.value.replace(/\n{3,}/g, "\n\n").trim()); setDocIssues([]); setDocReport(null); })
        .catch(() => setDocError("Couldn't read that Word file — try pasting the text."));
      reader.readAsArrayBuffer(file);
    } else if (/\.(txt|md)$/i.test(file.name) || file.type.startsWith("text/")) {
      reader.onload = () => { setDocText(String(reader.result)); setDocIssues([]); setDocReport(null); };
      reader.readAsText(file);
    } else if (/\.pdf$/i.test(file.name)) {
      reader.onload = async () => {
        setDocBusy("reading");
        try {
          const out = await callClaudeText([
            { type: "document", source: { type: "base64", media_type: "application/pdf", data: reader.result.split(",")[1] } },
            { type: "text", text: "Transcribe the full text of this document exactly as written, keeping paragraph breaks. Do not correct anything. Output only the text." },
          ], { max_tokens: 8000 });
          setDocText(out); setDocIssues([]); setDocReport(null);
        } catch (e) { setDocError(`Couldn't read that PDF (${e.message}).`); }
        finally { setDocBusy(""); }
      };
      reader.readAsDataURL(file);
    } else {
      setDocError("Upload a .docx, .pdf or .txt file, or paste the text.");
    }
  };

  const runDocCheck = async () => {
    if (!docText.trim()) { setDocError("Paste or upload your document first."); return; }
    setDocError("");
    setDocBusy("checking");
    setDocView("review");
    try {
      const parts = splitDocument(docText);
      const results = [];
      for (let i = 0; i < parts.length; i++) {
        setDocBusy(`checking${parts.length > 1 ? ` part ${i + 1} of ${parts.length}` : ""}`);
        results.push(await checkDocumentPart({ part: parts[i], index: i, total: parts.length, goal: docGoal, docType, tone: docTone }));
      }
      const stamp = Date.now();
      const issues = results.flatMap((r) => r.issues || [])
        .filter((x) => x && x.original && x.suggestion !== undefined && x.original !== x.suggestion && docText.includes(x.original))
        .map((x, k) => ({ ...x, type: DOC_ISSUE_TYPES[x.type] ? x.type : "style", id: `${stamp}-${k}`, status: "pending" }));
      setDocIssues(issues);
      setDocReport({ summary: results[0].summary, goalScore: results[0].goalScore, goalNotes: results.flatMap((r) => r.goalNotes || []).filter(Boolean).slice(0, 6), checkedAt: stamp });
      logDoc({ kind: "check", text: `Checked document: ${issues.length} issue(s) found` });
      if (!docId) setDocId(stamp);
    } catch (e) {
      setDocError(`Couldn't check the document (${e.message}) — try again.`);
    } finally {
      setDocBusy("");
    }
  };

  const resolveIssue = (issue, action, replacement) => {
    if (action === "accept") {
      const to = replacement !== undefined ? replacement : issue.suggestion;
      const { segs } = layoutIssues(docText, [issue]);
      let pos = 0, at = -1;
      segs.forEach((g) => { if (g.issue && at === -1) at = pos; pos += g.text.length; });
      if (at === -1) { setDocError("That text has changed since the check, so the fix can't be placed. Edit it by hand or re-check."); return; }
      setDocText(docText.slice(0, at) + to + docText.slice(at + issue.original.length));
      logDoc({ kind: "accepted", type: issue.type, from: issue.original, to });
      setDocIssues((l) => l.map((x) => (x.id === issue.id ? { ...x, status: "accepted", applied: to } : x)));
    } else {
      logDoc({ kind: "rejected", type: issue.type, from: issue.original, to: issue.suggestion });
      setDocIssues((l) => l.map((x) => (x.id === issue.id ? { ...x, status: "rejected" } : x)));
    }
    setDocActive(null);
  };

  // Puts an accepted change back to the original wording.
  const undoIssue = (issue) => {
    const at = docText.indexOf(issue.applied);
    if (at === -1) { setDocError("That change has been edited since, so it can't be undone automatically."); return; }
    setDocText(docText.slice(0, at) + issue.original + docText.slice(at + issue.applied.length));
    logDoc({ kind: "undone", type: issue.type, from: issue.applied, to: issue.original });
    setDocIssues((l) => l.map((x) => (x.id === issue.id ? { ...x, status: "pending", applied: undefined } : x)));
  };

  const acceptAllDoc = (type) => {
    let text = docText;
    const done = [];
    docIssues.filter((x) => x.status === "pending" && (type === "all" || x.type === type)).forEach((x) => {
      const at = text.indexOf(x.original);
      if (at === -1) return;
      text = text.slice(0, at) + x.suggestion + text.slice(at + x.original.length);
      done.push(x.id);
    });
    if (!done.length) return;
    setDocText(text);
    setDocIssues((l) => l.map((x) => (done.includes(x.id) ? { ...x, status: "accepted", applied: x.suggestion } : x)));
    logDoc({ kind: "accepted", type: type === "all" ? "all" : type, from: `${done.length} change(s)`, to: "accepted together" });
  };

  const switchDocView = (v) => {
    if (v === "edit") docEditStart.current = docText;
    if (v === "review" && docEditStart.current !== null && docEditStart.current !== docText) logDoc({ kind: "manual", text: "Edited the text by hand" });
    if (v === "review") docEditStart.current = null;
    setDocView(v);
  };

  const newDocument = () => {
    setDocId(null); setDocTitle(""); setDocGoal(""); setDocText(""); setDocIssues([]); setDocLog([]); setDocReport(null); setDocError(""); setDocView("review");
  };
  const openSavedDoc = (d) => {
    setDocId(d.id); setDocTitle(d.title || ""); setDocType(d.docType || "Business document"); setDocTone(d.tone || "Keep my tone"); setDocGoal(d.goal || "");
    setDocText(d.text || ""); setDocIssues(d.issues || []); setDocLog(d.log || []); setDocReport(d.report || null); setDocView("review"); setDocError("");
  };

  useEffect(() => {

      setSavedDocs((l) => [entry, ...l.filter((x) => x.id !== docId)].slice(0, HISTORY_LIMIT));

  const loadResumeFile = (file) => {

    setRvFileName(file.name);
    setRvPdf(null);

      reader.onload = () => setRvPdf(reader.result.split(",")[1]);

    } else if (/\.docx$/i.test(file.name)) {

          .then((r) => setRvText(r.value))

      setRvFileName("");
      setRvError("Upload a PDF or .docx file, or paste the text instead.");
    }
  };

  const runResumeReview = async () => {
    const usePdf = rvMode === "file" && !!rvPdf;
    if (!usePdf && !rvText.trim()) {
      setRvError(rvMode === "file" ? "Upload the client's resume first." : "Paste the resume text first.");
      return;
    }
    setRvError("");
    setRvLoading(true);
    setRvResult(null);
    try {
      const review = await generateResumeReview({
        clientName: rvName.trim(),
        targetRoles: rvTarget.trim(),

        pdfBase64: usePdf ? rvPdf : null,
      });
      const id = Date.now();
      review._id = id;
      setRvResult(review);
      setSavedReviews((list) => [{ id, savedAt: id, updatedAt: id, review }, ...list].slice(0, HISTORY_LIMIT));
    } catch (e) {

    } finally {

  };

  // In-place edits to the review; also kept in its Past reviews entry.
  const editReview = (patch) => {

    if (next._id) setSavedReviews((list) => list.map((h) => (h.id === next._id ? { ...h, review: next, updatedAt: Date.now() } : h)));
  };
  const editReviewSection = (i, field, v) => {
    if (i === 0) editReview({ verdict: v });
    else editReview({ findings: rvResult.findings.map((f, j) => (j === i - 1 ? { ...f, [field]: v } : f)) });
  };

  // Keep the post library in step with edits and revisions of the open post.
  useEffect(() => {
    if (!postResult || !postResult._id) return;
    setSavedPosts((list) => list.map((x) => (x.id === postResult._id && x.result !== postResult ? { ...x, result: postResult, updatedAt: Date.now() } : x)));
  }, [postResult]);

  const deleteSavedPost = (id) => { setSavedPosts((list) => list.filter((x) => x.id !== id)); forget(id); };
  const openSavedPost = (x) => {
    setPostTask(x.task || "create");

    setPostResult(x.result);

  // ---- Cloud sync for posts, weeks and reviews (Supabase via /api/memory?doc=content) ----
  // Uses the same passcode as Memory. On connect, cloud and device copies are
  // merged (nothing is dropped); after that every change is saved back.
  const [contentReady, setContentReady] = useState(false);
  const [contentStatus, setContentStatus] = useState("");
  useEffect(() => {
    if (!syncKey) { setContentReady(false); setContentStatus(""); return; }
    let cancelled = false;
    setContentStatus("loading");
    fetch("/api/memory?doc=content", { headers: { "x-desk-key": syncKey } })
      .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || `Sync failed (${r.status})`); return d; })
      .then((d) => {
        if (cancelled) return;
        const c = d.data || {};
        const gone = [...new Set([...(c.deletedIds || []), ...deletedIds])];
        setDeletedIds(gone);
        setSavedPosts((l) => mergeById(l, c.savedPosts, gone));
        setSavedWeeks((l) => mergeById(l, c.savedWeeks, gone));
        setSavedReviews((l) => mergeById(l, c.savedReviews, gone));
        setSavedDocs((l) => mergeById(l, c.savedDocs, gone));
        setContentReady(true);
      })
      .catch((e) => { if (!cancelled) { setContentReady(false); setContentStatus(e.message); } });
    return () => { cancelled = true; };
  }, [syncKey]);

  useEffect(() => {
    if (!syncKey || !contentReady) return;
    setContentStatus("saving");
    const t = setTimeout(() => {
      fetch("/api/memory?doc=content", {
        method: "PUT",
        headers: { "Content-Type": "application/json", "x-desk-key": syncKey },
        body: JSON.stringify({ data: { savedPosts, savedWeeks, savedReviews, savedDocs, deletedIds } }),
      })
        .then(async (r) => { if (!r.ok) { const d = await r.json().catch(() => ({})); throw new Error(d.error || `Sync failed (${r.status})`); } setContentStatus("saved"); })
        .catch((e) => setContentStatus(e.message));
    }, 1500);
    return () => clearTimeout(t);
  }, [savedPosts, savedWeeks, savedReviews, savedDocs, deletedIds, contentReady]);

  const cloudBanner = (

            const chipBtn = (on) => ({ padding: "5px 10px", borderRadius: 14, border: `1px solid ${on ? INK : "#D8D0BC"}`, background: on ? INK : "#fff", color: on ? PAPER : INK, fontFamily: "'Courier New', monospace", fontSize: 11.5, cursor: "pointer" });
            const smallBtn = (bg, fg, border) => ({ padding: "6px 12px", background: bg, color: fg, border: border || "none", borderRadius: 6, fontFamily: "'Courier New', monospace", fontSize: 12, cursor: "pointer" });
            return (
            <div>
              <p style={{ fontSize: 13, color: "#5A5142", marginTop: 0, marginBottom: 14, fontFamily: "'Courier New', monospace" }}>

              </p>

              {cloudBanner}

              {savedDocs.length > 0 && (
                <details style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "10px 14px", marginBottom: 14 }}>
                  <summary style={{ cursor: "pointer", fontSize: 13, fontWeight: 700 }}>My documents ({savedDocs.length})</summary>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 10 }}>
                    {savedDocs.map((d) => (
                      <div key={d.id} style={{ display: "flex", gap: 8, alignItems: "center", borderTop: "1px solid #EEE8DA", paddingTop: 6 }}>
                        <button onClick={() => openSavedDoc(d)} style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", padding: 0, cursor: "pointer", color: INK, fontSize: 13, fontWeight: d.id === docId ? 700 : 400 }}>
                          <span style={{ fontFamily: "'Courier New', monospace", fontSize: 11, color: "#8A8272", marginRight: 8 }}>{formatSavedAt(d.updatedAt || d.savedAt)}</span>{d.title}
                        </button>
                        <button onClick={() => { setSavedDocs((l) => l.filter((x) => x.id !== d.id)); forget(d.id); if (d.id === docId) newDocument(); }} title="Delete" style={{ background: "none", border: "none", color: "#8A8272", cursor: "pointer", fontSize: 16, lineHeight: 1 }}>&times;</button>
                      </div>
                    ))}
                  </div>
                </details>
              )}

              <div style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "14px 16px", marginBottom: 14, display: "flex", flexDirection: "column", gap: 12 }}>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  <div style={{ flex: "2 1 220px" }}>
                    <label style={labelStyle}>DOCUMENT NAME</label>
                    <input value={docTitle} onChange={(e) => setDocTitle(e.target.value)} placeholder="e.g. Proposal for Acme" style={selectStyle} />
                  </div>
                  <div style={{ flex: "1 1 160px" }}>
                    <label style={labelStyle}>TYPE</label>
                    <select value={docType} onChange={(e) => setDocType(e.target.value)} style={selectStyle}>
                      {["Business document", "Resume / CV", "Cover letter", "Proposal", "Email", "Report", "Academic paper", "Blog / LinkedIn article", "Website copy", "Other"].map((o) => <option key={o}>{o}</option>)}
                    </select>
                  </div>
                  <div style={{ flex: "1 1 160px" }}>
                    <label style={labelStyle}>TONE</label>
                    <select value={docTone} onChange={(e) => setDocTone(e.target.value)} style={selectStyle}>
                      {["Keep my tone", "Formal", "Professional but warm", "Friendly", "Persuasive", "Academic", "Simple and clear"].map((o) => <option key={o}>{o}</option>)}
                    </select>
                  </div>
                </div>
                <div>
                  <label style={labelStyle}>WHAT DO YOU WANT TO ACHIEVE WITH THIS DOCUMENT?</label>
                  <textarea value={docGoal} onChange={(e) => setDocGoal(e.target.value)} placeholder="e.g. Win a $5k website project from a small law firm; show I understand their problem and make it easy to say yes." style={{ ...selectStyle, minHeight: 64, fontFamily: "inherit", resize: "vertical" }} />
                </div>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                  <input type="file" accept=".docx,.pdf,.txt,.md,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onChange={(e) => loadDocFile(e.target.files[0])} style={{ fontFamily: "'Courier New', monospace", fontSize: 12 }} />
                  <span style={{ fontSize: 11.5, color: "#8A8272", fontFamily: "'Courier New', monospace" }}>or paste / type below &middot; {words} words</span>
                </div>
              </div>

              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 14 }}>
                <button onClick={runDocCheck} disabled={!!docBusy} style={{ ...smallBtn(INK, PAPER), padding: "9px 16px", fontSize: 13, opacity: docBusy ? 0.6 : 1 }}>
                  {docBusy === "reading" ? "Reading PDF..." : docBusy.startsWith("checking") ? `Checking${docBusy.slice(8)}...` : docReport ? "Re-check document" : "Check document"}
                </button>
                <button onClick={() => { copyText(docText); setDocCopied(true); setTimeout(() => setDocCopied(false), 1600); }} disabled={!docText} style={{ ...smallBtn(docCopied ? SAFE : "transparent", docCopied ? PAPER : INK, `1px solid ${docCopied ? SAFE : INK}`), padding: "9px 16px", fontSize: 13 }}>{docCopied ? "Copied" : "Copy text"}</button>
                <button onClick={() => downloadDocPdf(docTitle, docText)} disabled={!docText} style={{ ...smallBtn("transparent", INK, `1px solid ${INK}`), padding: "9px 16px", fontSize: 13 }}>Download PDF</button>
                <button onClick={newDocument} style={{ ...smallBtn("transparent", "#8A8272", "1px solid #D8D0BC"), padding: "9px 16px", fontSize: 13 }}>New document</button>
              </div>

              {docError && <p style={{ color: RISK, fontSize: 12, fontFamily: "'Courier New', monospace" }}>{docError}</p>}

              {docReport && (
                <div style={{ padding: "14px 16px", borderRadius: 6, background: INK, marginBottom: 14, display: "flex", gap: 16, flexWrap: "wrap" }}>
                  {docReport.goalScore !== null && docReport.goalScore !== undefined && docGoal && (
                    <div style={{ textAlign: "center", minWidth: 80 }}>
                      <div style={{ color: BRASS, fontFamily: "'Courier New', monospace", fontSize: 11 }}>GOAL FIT</div>
                      <div style={{ color: PAPER, fontSize: 30, fontWeight: 700 }}>{docReport.goalScore}</div>
                      <div style={{ color: "#9AA3B0", fontSize: 11 }}>out of 100</div>
                    </div>
                  )}
                  <div style={{ flex: "1 1 240px" }}>
                    <div style={{ color: BRASS, fontFamily: "'Courier New', monospace", fontSize: 11, marginBottom: 4 }}>OVERVIEW &middot; {pending.length} open &middot; {resolved.length} resolved</div>

                    {(docReport.goalNotes || []).length > 0 && (
                      <ul style={{ color: "#C9CED6", fontSize: 12.5, lineHeight: 1.6, margin: "8px 0 0", paddingLeft: 18 }}>

                  </div>
                </div>

                <div style={{ minWidth: 0, background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6 }}>

                    <button onClick={() => switchDocView("edit")} style={chipBtn(docView === "edit")}>Edit text</button>
                    <span style={{ fontSize: 11, color: "#8A8272", fontFamily: "'Courier New', monospace", marginLeft: "auto" }}>
                      {docView === "review" ? "Click a highlight to fix it" : "Type freely · highlight words for AI options"}
                    </span>
                  </div>
                  <div style={{ padding: "22px 26px", fontSize: 16, lineHeight: 1.8, color: INK, minHeight: 320 }}>
                    {docView === "edit" || !docText ? (
                      docText || docView === "edit" ? (
                        <EditableText aiKind={`${docType} (document)`} value={docText} onChange={setDocText} fontSize={16} />
                      ) : (
                        <textarea value={docText} onChange={(e) => setDocText(e.target.value)} placeholder="Paste or type your document here..." style={{ width: "100%", minHeight: 320, border: "none", outline: "none", resize: "vertical", fontFamily: "inherit", fontSize: 16, color: INK, background: "transparent" }} />
                      )
                    ) : (
                      <div style={{ whiteSpace: "pre-wrap", wordBreak: "break-word" }}>
                        {segs.map((g, k) => g.issue ? (
                          <span key={k} data-hl={g.issue.id} onClick={() => setDocActive(g.issue.id)} title={`${DOC_ISSUE_TYPES[g.issue.type].label}: ${g.issue.why || ""}`} style={{
                            cursor: "pointer", borderBottom: `2px solid ${DOC_ISSUE_TYPES[g.issue.type].color}`,
                            background: docActive === g.issue.id ? "#F3E3B8" : "rgba(156,122,50,0.10)", borderRadius: 2,
                            opacity: docFilter === "all" || docFilter === g.issue.type ? 1 : 0.5,
                          }}>
                            {docActive === g.issue.id ? (
                              <>
                                <span style={{ textDecoration: "line-through", color: RISK }}>{g.text}</span>
                                <span style={{ color: SAFE, fontWeight: 600 }}>{g.issue.suggestion ? ` ${g.issue.suggestion}` : " (remove)"}</span>
                              </>
                            ) : g.text}
                          </span>
                        ) : <span key={k}>{g.text}</span>)}
                      </div>
                    )}
                  </div>
                </div>

                <div className="doc-side">
                  <div style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "12px 14px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                      <div style={{ fontSize: 14, fontWeight: 700 }}>Suggestions ({pending.length})</div>
                      {pending.length > 0 && <button onClick={() => acceptAllDoc(docFilter)} style={smallBtn(SAFE, PAPER)}>Accept all{docFilter !== "all" ? ` ${DOC_ISSUE_TYPES[docFilter].label.toLowerCase()}` : ""}</button>}
                    </div>
                    {counts.length > 0 && (
                      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
                        <button onClick={() => setDocFilter("all")} style={chipBtn(docFilter === "all")}>All {pending.length}</button>
                        {counts.map(([k, n]) => <button key={k} onClick={() => setDocFilter(k)} style={chipBtn(docFilter === k)}>{DOC_ISSUE_TYPES[k].label} {n}</button>)}
                      </div>
                    )}
                    {!docReport && <div style={{ fontSize: 12.5, color: "#8A8272" }}>Add your document and goal, then click Check document.</div>}
                    {docReport && pending.length === 0 && <div style={{ fontSize: 12.5, color: SAFE }}>No open suggestions. Re-check after big edits.</div>}
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {shown.map((x) => (
                        <div key={x.id} data-card={x.id} onClick={() => setDocActive(x.id)} style={{ border: `1px solid ${docActive === x.id ? BRASS : "#EEE8DA"}`, borderLeft: `4px solid ${DOC_ISSUE_TYPES[x.type].color}`, borderRadius: 6, padding: "8px 10px", cursor: "pointer", background: docActive === x.id ? "#FBF6E9" : "#fff" }}>
                          <div style={{ fontSize: 10.5, fontFamily: "'Courier New', monospace", color: DOC_ISSUE_TYPES[x.type].color, letterSpacing: 0.5, marginBottom: 4 }}>{DOC_ISSUE_TYPES[x.type].label.toUpperCase()}</div>
                          <div style={{ fontSize: 13, lineHeight: 1.5 }}>
                            <span style={{ textDecoration: "line-through", color: RISK }}>{x.original}</span>{" → "}
                            <span style={{ color: SAFE, fontWeight: 600 }}>{x.suggestion || "(remove)"}</span>
                          </div>
                          {x.why && <div style={{ fontSize: 12, color: "#5A5142", marginTop: 4 }}>{x.why}</div>}
                          {docActive === x.id && (
                            <div onClick={(e) => e.stopPropagation()} style={{ marginTop: 8 }}>
                              <input defaultValue={x.suggestion} id={`fix-${x.id}`} style={{ ...selectStyle, fontSize: 13, padding: "6px 8px", marginBottom: 6 }} />
                              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                                <button onClick={() => resolveIssue(x, "accept")} style={smallBtn(SAFE, PAPER)}>Accept</button>
                                <button onClick={() => resolveIssue(x, "accept", document.getElementById(`fix-${x.id}`).value)} style={smallBtn(BRASS, PAPER)}>Use my edit</button>
                                <button onClick={() => resolveIssue(x, "reject")} style={smallBtn("transparent", INK, `1px solid ${INK}`)}>Reject</button>
                              </div>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>

                  {docLog.length > 0 && (
                    <details style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "10px 14px" }}>
                      <summary style={{ cursor: "pointer", fontSize: 13, fontWeight: 700 }}>Change history ({docLog.length})</summary>
                      <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 10, maxHeight: 320, overflowY: "auto" }}>
                        {docLog.map((l) => {
                          const issue = l.kind === "accepted" && docIssues.find((x) => x.status === "accepted" && x.original === l.from && x.applied === l.to);
                          return (
                            <div key={l.id} style={{ fontSize: 12, borderTop: "1px solid #EEE8DA", paddingTop: 6 }}>
                              <span style={{ fontFamily: "'Courier New', monospace", color: "#8A8272", marginRight: 6 }}>{formatSavedAt(l.at)}</span>
                              <b style={{ color: l.kind === "accepted" ? SAFE : l.kind === "rejected" ? RISK : INK }}>{l.kind === "check" ? "Checked" : l.kind === "manual" ? "Manual edit" : l.kind[0].toUpperCase() + l.kind.slice(1)}</b>
                              {l.text ? ` · ${l.text}` : (
                                <> &middot; <span style={{ textDecoration: "line-through", color: RISK }}>{l.from}</span> &rarr; <span style={{ color: SAFE }}>{l.to}</span></>
                              )}
                              {issue && <button onClick={() => undoIssue(issue)} style={{ marginLeft: 8, background: "none", border: "none", padding: 0, color: BRASS, cursor: "pointer", fontSize: 11.5, textDecoration: "underline" }}>Undo</button>}
                            </div>
                          );
                        })}
                      </div>
                    </details>
                  )}
                </div>
              </div>
            </div>
            );
          })()}

          {tab === "review" && (
            <div>
              <p style={{ fontSize: 13, color: "#5A5142", marginTop: 0, marginBottom: 18, fontFamily: "'Courier New', monospace" }}>
                Upload a prospect's resume and get a client-ready diagnostic review, benchmarked against your house style.
              </p>

              {savedReviews.length > 0 && (
                <details style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "10px 14px", marginBottom: 18 }}>
                  <summary style={{ cursor: "pointer", fontSize: 13, fontWeight: 700 }}>Past reviews ({savedReviews.length})</summary>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6, marginTop: 10 }}>
                    {savedReviews.map((h) => (
                      <div key={h.id} style={{ display: "flex", gap: 8, alignItems: "center", justifyContent: "space-between", borderTop: "1px solid #EEE8DA", paddingTop: 6 }}>
                        <button onClick={() => ((x) => setRvResult(x.review))(h)} style={{ flex: 1, minWidth: 0, textAlign: "left", background: "none", border: "none", padding: 0, cursor: "pointer", color: INK, fontSize: 13, fontWeight: rvResult && (h.review === rvResult || h.id === rvResult._id) ? 700 : 400 }}>
                          <span style={{ fontFamily: "'Courier New', monospace", fontSize: 11, color: "#8A8272", marginRight: 8 }}>{formatSavedAt(h.id)}</span>{h.review.clientName} &middot; {h.review.industry}
                        </button>
                        <button onClick={() => ((id) => { setSavedReviews((list) => list.filter((r) => r.id !== id)); forget(id); })(h.id)} title="Delete" style={{ background: "none", border: "none", color: "#8A8272", cursor: "pointer", fontSize: 16, lineHeight: 1 }}>&times;</button>
                      </div>
                    ))}
                  </div>
                </details>
              )}


              <div style={{ display: "flex", flexDirection: "column", gap: 14, marginBottom: 18 }}>
                <div>
                  <label style={labelStyle}>CLIENT NAME (OPTIONAL — READ FROM RESUME IF BLANK)</label>
                  <input value={rvName} onChange={(e) => setRvName(e.target.value)} placeholder="Sabine Oster" style={selectStyle} />
                </div>
                <div>
                  <label style={labelStyle}>TARGET ROLES / INDUSTRY (OPTIONAL)</label>
                  <input value={rvTarget} onChange={(e) => setRvTarget(e.target.value)} placeholder="Manufacturing technician, aerospace assembly" style={selectStyle} />
                </div>

                <div style={{ display: "flex", gap: 10 }}>
                  {[{ id: "file", label: "Upload PDF / Word" }, { id: "text", label: "Paste text" }].map((m) => (
                    <button key={m.id} onClick={() => setRvMode(m.id)} style={{
                      flex: 1, padding: "8px 14px", borderRadius: 6, cursor: "pointer",
                      fontFamily: "'Courier New', monospace", fontSize: 12,
                      background: rvMode === m.id ? INK : "transparent", color: rvMode === m.id ? PAPER : INK,
                      border: `1px solid ${INK}`,
                    }}>{m.label}</button>
                  ))}
                </div>

                {rvMode === "file" ? (
                  <div>
                    <label style={labelStyle}>RESUME FILE (.PDF OR .DOCX)</label>
                    <input type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" onChange={(e) => loadResumeFile(e.target.files[0])} style={{ fontFamily: "'Courier New', monospace", fontSize: 12 }} />
                    {rvFileName && (rvPdf || rvText) && <div style={{ marginTop: 6, fontSize: 12, color: SAFE, fontFamily: "'Courier New', monospace" }}>Loaded: {rvFileName}</div>}
                  </div>
                ) : (
                  <div>
                    <label style={labelStyle}>RESUME TEXT</label>
                    <textarea value={rvText} onChange={(e) => setRvText(e.target.value)} placeholder="Paste the full resume here..." style={{ ...selectStyle, minHeight: 180, fontFamily: "inherit", resize: "vertical" }} />
                  </div>
                )}
              </div>

              <button onClick={runResumeReview} disabled={rvLoading} style={{
                padding: "9px 16px", background: INK, color: PAPER, border: "none", borderRadius: 6,
                fontFamily: "'Courier New', monospace", fontSize: 13, cursor: rvLoading ? "default" : "pointer",
                opacity: rvLoading ? 0.6 : 1, marginBottom: 16,
              }}>{rvLoading ? "Reviewing..." : "Review resume"}</button>

              {rvError && <p style={{ color: RISK, fontSize: 12, fontFamily: "'Courier New', monospace" }}>{rvError}</p>}

              {rvResult && (
                <div>
                  <div style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "22px 20px", fontSize: 14, lineHeight: 1.65, color: INK }}>
                    <div style={{ textAlign: "center", fontWeight: 700, fontSize: 17, letterSpacing: 0.5 }}>{rvResult.industry} RESUME REVIEW</div>
                    <div style={{ marginTop: 14, fontSize: 13 }}><b>For:</b> {rvResult.clientName}</div>
                    <div style={{ marginBottom: 12, fontSize: 13 }}><b>Prepared By:</b> Resume Reviewer</div>
                    <div style={{ ...EDIT_HINT, marginTop: 0, marginBottom: 8 }}>Click any text to edit, or highlight words for AI options &mdash; the PDF and copy use your edits.</div>
                    <div style={{ margin: "0 0 6px" }}><EditableText aiKind="client resume review" aiNiche={rvResult.industry} value={rvResult.intro} onChange={(v) => editReview({ intro: v })} /></div>
                    {resumeReviewSections(rvResult).map((s, i) => (
                      <div key={i}>
                        <div style={{ fontWeight: 700, marginTop: 16, marginBottom: 4, display: "flex", gap: 4 }}>
                          <span>{i + 1})</span>

                            <input value={s.headline} onChange={(e) => editReviewSection(i, "headline", e.target.value)} style={{ flex: 1, border: "none", outline: "none", background: "transparent", font: "inherit", color: INK, padding: 0 }} />
                          )}
                        </div>
                        <EditableText aiKind="client resume review" aiNiche={rvResult.industry} value={s.body} onChange={(v) => editReviewSection(i, "body", v)} />
                      </div>
                    ))}
                    <div style={{ fontWeight: 700, marginTop: 16, marginBottom: 4 }}>FINAL DIAGNOSIS</div>
                    <EditableText aiKind="client resume review" aiNiche={rvResult.industry} value={rvResult.diagnosis} onChange={(v) => editReview({ diagnosis: v })} />
                    <div style={{ fontWeight: 700, marginTop: 16, marginBottom: 4 }}>BOTTOM LINE</div>
                    <EditableText aiKind="client resume review" aiNiche={rvResult.industry} value={rvResult.bottomLine} onChange={(v) => editReview({ bottomLine: v })} />
                  </div>
                  <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginTop: 12 }}>
                    <button onClick={copyResumeReview} style={{
                      padding: "9px 16px", background: rvCopied ? SAFE : INK, color: PAPER, border: "none",
                      borderRadius: 6, fontFamily: "'Courier New', monospace", fontSize: 13, cursor: "pointer",
                    }}>{rvCopied ? "Copied" : "Copy review"}</button>
                    <button onClick={() => downloadResumeReviewPdf(rvResult)} style={{
                      padding: "9px 16px", background: "transparent", color: INK, border: `1px solid ${INK}`,
                      borderRadius: 6, fontFamily: "'Courier New', monospace", fontSize: 13, cursor: "pointer",
                    }}>Download PDF</button>
                    <button onClick={runResumeReview} disabled={rvLoading} style={{
                      padding: "9px 16px", background: "transparent", color: INK, border: `1px solid ${INK}`,
                      borderRadius: 6, fontFamily: "'Courier New', monospace", fontSize: 13, cursor: "pointer",
                    }}>Regenerate</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {tab === "memory" && (
            <div>
              <p style={{ fontSize: 13, color: "#5A5142", marginTop: 0, marginBottom: 18, fontFamily: "'Courier New', monospace" }}>
                What the desk remembers. Standing notes go into every AI reply; client profiles keep each client's thread and notes. Saved in this browser, and synced to the cloud once you connect below.
              </p>

              <label style={labelStyle}>STANDING NOTES</label>
              <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 10 }}>
                {(memory.notes || []).length === 0 && <div style={{ fontSize: 13, color: "#8A8272" }}>None yet. e.g. "Holiday closure Dec 22 – Jan 2; quote turnaround from Jan 5."</div>}
                {(memory.notes || []).map((n) => (
                  <div key={n.id} style={{ display: "flex", gap: 8, alignItems: "flex-start", background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "8px 12px" }}>
                    <div style={{ flex: 1, fontSize: 13, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{n.text}</div>
                    <button onClick={() => deleteNote(n.id)} title="Forget" style={{ background: "none", border: "none", color: "#8A8272", cursor: "pointer", fontSize: 16, lineHeight: 1 }}>&times;</button>
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
                <input value={newNote} onChange={(e) => setNewNote(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addNote()} placeholder="Add something to remember…" style={{ ...selectStyle, flex: 1 }} />
                <button onClick={addNote} style={{ padding: "8px 16px", background: INK, color: PAPER, border: "none", borderRadius: 6, cursor: "pointer", fontFamily: "'Courier New', monospace", fontSize: 13 }}>Remember</button>
              </div>

              <label style={labelStyle}>CLIENTS ({Object.keys(memory.clients || {}).length})</label>
              <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 24 }}>
                {Object.keys(memory.clients || {}).length === 0 && <div style={{ fontSize: 13, color: "#8A8272" }}>Enter a client name on "Respond to client" and the thread is saved here automatically.</div>}
                {Object.entries(memory.clients || {}).sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0)).map(([k, c]) => (
                  <div key={k} style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "10px 14px" }}>
                    <div style={{ display: "flex", gap: 8, alignItems: "baseline", justifyContent: "space-between", flexWrap: "wrap" }}>
                      <div style={{ fontSize: 14, fontWeight: 700 }}>{c.name}
                        <span style={{ fontFamily: "'Courier New', monospace", fontSize: 11, color: "#8A8272", marginLeft: 8, fontWeight: 400 }}>{(c.convo || []).length} msgs{c.updatedAt ? ` · ${formatSavedAt(c.updatedAt)}` : ""}</span>
                      </div>
                      <div style={{ display: "flex", gap: 10 }}>
                        <button onClick={() => loadClient(k)} style={{ background: "none", border: "none", color: BRASS, cursor: "pointer", fontSize: 13, fontWeight: 700 }}>Open thread</button>
                        <button onClick={() => window.confirm(`Forget ${c.name}?`) && deleteClient(k)} style={{ background: "none", border: "none", color: "#8A8272", cursor: "pointer", fontSize: 13 }}>Forget</button>
                      </div>
                    </div>
                    <textarea value={c.notes || ""} onChange={(e) => updateClientNotes(k, e.target.value)} placeholder="Notes the AI should know (target role, package bought, preferences…)" rows={2} style={{ ...selectStyle, width: "100%", marginTop: 8, boxSizing: "border-box", resize: "vertical", fontFamily: "inherit" }} />
                  </div>
                ))}
              </div>

              <label style={labelStyle}>CLOUD SYNC (SUPABASE)</label>
              {syncKey ? (
                <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 24, fontSize: 13 }}>
                  <span style={{ color: syncReady ? "#3C6E47" : "#9A3B2E" }}>
                    {syncStatus === "loading" ? "Connecting…" : syncStatus === "saving" ? "Saving…" : syncStatus === "saved" ? "Synced — memory is shared across your devices." : syncStatus}
                  </span>
                  <button onClick={() => { setSyncKey(""); setSyncStatus(""); }} style={{ background: "none", border: "none", color: "#8A8272", cursor: "pointer", fontSize: 13, textDecoration: "underline" }}>Disconnect</button>
                </div>
              ) : (
                <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
                  <input type="password" value={syncKeyInput} onChange={(e) => setSyncKeyInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && syncKeyInput.trim() && (setSyncKey(syncKeyInput.trim()), setSyncKeyInput(""))} placeholder="Memory passcode" style={{ ...selectStyle, flex: 1 }} />
                  <button onClick={() => { if (syncKeyInput.trim()) { setSyncKey(syncKeyInput.trim()); setSyncKeyInput(""); } }} style={{ padding: "8px 16px", background: INK, color: PAPER, border: "none", borderRadius: 6, cursor: "pointer", fontFamily: "'Courier New', monospace", fontSize: 13 }}>Connect</button>
                </div>
              )}

              <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
                <button onClick={exportMemory} style={{ padding: "8px 16px", background: INK, color: PAPER, border: "none", borderRadius: 6, cursor: "pointer", fontFamily: "'Courier New', monospace", fontSize: 13 }}>Export memory</button>
                <label style={{ padding: "8px 16px", border: `1px solid ${INK}`, borderRadius: 6, cursor: "pointer", fontFamily: "'Courier New', monospace", fontSize: 13 }}>
                  Import memory
                  <input type="file" accept="application/json,.json" onChange={(e) => { importMemory(e.target.files[0]); e.target.value = ""; }} style={{ display: "none" }} />
                </label>
                {memMsg && <span style={{ fontSize: 13, color: "#5A5142" }}>{memMsg}</span>}
              </div>
            </div>
          )}

          {tab === "ranking" && (
            <div>
              <p style={{ fontSize: 13, color: "#5A5142", marginTop: 0, marginBottom: 18, fontFamily: "'Courier New', monospace" }}>
                A repeatable checklist for improving where your profile ranks in LinkedIn Services search.
              </p>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {RANKING_STEPS.map((s) => (
                  <div key={s.n} style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "14px 16px" }}>
                    <div style={{ display: "flex", gap: 10, alignItems: "baseline" }}>
                      <span style={{ color: BRASS, fontFamily: "'Courier New', monospace", fontSize: 12, fontWeight: 700 }}>{s.n}</span>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>{s.title}</div>
                        <div style={{ fontSize: 13, color: "#5A5142", lineHeight: 1.6 }}>{s.body}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
