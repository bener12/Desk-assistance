// Cross-browser copy: use the async Clipboard API when available (needs a
// secure context), otherwise fall back to a hidden textarea + execCommand so
// copy still works on older or non-HTTPS mobile browsers.
function copyText(text) {
  const value = text || "";
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(value).catch(() => fallbackCopy(value));
  }
  return Promise.resolve(fallbackCopy(value));
}

function fallbackCopy(value) {
  try {
    const ta = document.createElement("textarea");
    ta.value = value;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  } catch (e) {
    /* nothing else we can do */
  }
}

// Distilled from Erika's real message history — used as the system prompt so replies
// are genuinely drafted for what the client wrote, not picked from a fixed list.
const VOICE_SYSTEM_PROMPT = `You are drafting a LinkedIn reply for Erika, a resume-writing specialist, replying to a client message. Match her real voice exactly:

- Formal but warm. Opens with "Thank you for..." / "Thanks for sharing..." / "Kindly...". Never casual ("Hey", "Hiya").
- States problems factually before offering the fix, e.g. "After reviewing your resume, I noticed it does not meet the standard required for the applicant tracking system." Diagnosis first, reassurance second.
- Calm, firm boundaries on scope/policy (e.g. no phone calls, payment upfront) — polite but does not waver.
- Reassurance uses specific, repeatable commitments: "100% customer satisfaction," "up to two revisions," never vague promises.
- Sign-off is "Best regards," "Sincerely," "Thanks," or just her name — never casual sign-offs.
- No em-dashes. Minimal to no exclamation marks. Contractions used sparingly (some "I'm", "I'd", but not heavily casual).
- Never mentions AI, generic terms like "leverage" or "synergy," or filler enthusiasm.
- Keep replies as short as the situation allows — most of her real replies are 1-4 sentences, occasionally longer only for detailed feedback or a full policy explanation.

Here are real examples of her voice for grounding (do not copy these verbatim, use them only to match tone and structure):
${[
  "After reviewing your resume, I noticed it does not meet the standards required for the applicant tracking system. However, I'm confident I can help transform it into a professional resume that truly stands out.",
  "I don't offer phone consultations, but I'd be happy to answer any questions or concerns you have here.",
  "I understand your concern, and I want to assure you that I guarantee 100% customer satisfaction. You can request up to two revisions after receiving the initial draft to ensure it meets your expectations.",
  "Thank you for sharing that. Please feel free to provide more details about your volunteer work, including your responsibilities and the impact of your involvement.",
  "Full payment is required upfront. I'll send the invoice to your email address shortly.",
  "I want to assure you that I do not use AI to write. Every resume I create is personally crafted with careful attention to detail.",
].map((l) => `- ${l}`).join("\n")}

Write ONE reply, addressed to what the client actually said. Do not add a subject line. Do not explain your reasoning — output only the reply text.`;

async function generateAIResponse({ clientMessage, situationLabel, clientName, extraContext }) {
  const userPrompt = [
    situationLabel ? `Context: ${situationLabel}.` : "",
    clientName ? `Client's name: ${clientName}.` : "",
    extraContext || "",
    `Client's message:\n"""${clientMessage}"""`,
    "Draft Erika's reply.",
  ].filter(Boolean).join("\n\n");

  const res = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: VOICE_SYSTEM_PROMPT,
      messages: [{ role: "user", content: userPrompt }],
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Request failed (${res.status})`);
  }
  const data = await res.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n")
    .trim();
  if (!text) throw new Error("Empty response");
  return text;
}

async function generatePostFromClaude({ task, niche, keywords, formatPref, sourceText, contextNote, imageBase64, imageMediaType }) {
  const keywordLine = keywords ? `Also naturally weave in these target keywords so they read as exact or near-exact phrases (for search/discovery relevance, not stuffed): ${keywords}. Note briefly how you reinforced them.` : "";

  let instructions;
  if (task === "rewrite") {
    instructions = `You are a LinkedIn content strategist. Analyze the ORIGINAL POST (given as text or an image below), identify its viral format/hook pattern (e.g. before/after story, contrarian hot take, curated list, quantified result), briefly explain why that pattern works, then rewrite the post so it fits the niche of "${niche}" while keeping the same structural pattern and emotional hook.

${keywordLine}
${contextNote ? `Extra context from the user: ${contextNote}` : ""}

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{"format": "short format label", "why": "1-2 sentence explanation of why this pattern works", "keywordNote": "1 sentence on how keywords were woven in, or empty string if none given", "rewritten": "the full rewritten post ready to publish, in the target niche"}`;
  } else {
    instructions = `You are a LinkedIn content strategist for the niche "${niche}". The user wants a brand new post built around the topic, story, client review, or photo given below (not a rewrite of an existing viral post). Pick the strongest viral format for this material${formatPref ? ` \u2014 the user prefers: ${formatPref}` : " (before/after story, contrarian hot take, curated list, or quantified result \u2014 whichever fits the material best)"}, explain briefly why that format suits this material, then write the full post.

${keywordLine}
${contextNote ? `Extra context from the user: ${contextNote}` : ""}

Respond ONLY with valid JSON, no markdown fences, no preamble, in this exact shape:
{"format": "short format label", "why": "1-2 sentence explanation of why this format fits this material", "keywordNote": "1 sentence on how keywords were woven in, or empty string if none given", "rewritten": "the full new post ready to publish"}`;
  }

  const content = [];
  if (imageBase64) {
    content.push({ type: "image", source: { type: "base64", media_type: imageMediaType, data: imageBase64 } });
    content.push({ type: "text", text: instructions + (sourceText ? `\n\nUser's notes about the photo/topic:\n"""${sourceText}"""` : "") });
  } else {
    const label = task === "rewrite" ? "ORIGINAL POST" : "TOPIC / STORY / REVIEW";
    content.push({ type: "text", text: instructions + `\n\n${label}:\n"""${sourceText}"""` });
  }

  const res = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content }],
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error || `Request failed (${res.status})`);
  }
  const data = await res.json();
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
  const clean = text.replace(/```json|```/g, "").trim();
  return JSON.parse(clean);
}

function verdict(score, max) {
  const pct = max ? score / max : 0;
  if (pct >= 0.55) return { text: "Looks likely fake or low-value — verify before spending time", color: RISK, glyph: "⚠" };
  if (pct >= 0.25) return { text: "Mixed signals — worth a quick clarifying question first", color: CAUTION, glyph: "?" };
  return { text: "Looks like a real, worthwhile lead", color: SAFE, glyph: "✓" };
}

            <div>
              <p style={{ fontSize: 13, color: "#5A5142", marginTop: 0, marginBottom: 18, fontFamily: "'Courier New', monospace" }}>
                Rewrite a proven post into your niche, or build a new one from a client win or photo.
              </p>

              <div style={{ display: "flex", gap: 10, marginBottom: 18 }}>
                <button onClick={() => { setPostTask("rewrite"); setPostResult(null); setPostError(""); }} style={{
                  flex: 1, padding: "10px 12px", borderRadius: 6, cursor: "pointer",
                  fontFamily: "'Courier New', monospace", fontSize: 12,
                  background: postTask === "rewrite" ? INK : "transparent", color: postTask === "rewrite" ? PAPER : INK,
                  border: `1px solid ${INK}`,
                }}>Rewrite existing post</button>
                <button onClick={() => { setPostTask("create"); setPostResult(null); setPostError(""); }} style={{
                  flex: 1, padding: "10px 12px", borderRadius: 6, cursor: "pointer",
                  fontFamily: "'Courier New', monospace", fontSize: 12,
                  background: postTask === "create" ? INK : "transparent", color: postTask === "create" ? PAPER : INK,
                  border: `1px solid ${INK}`,
                }}>Create from topic / photo</button>
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: 14, marginBottom: 18 }}>
                <div>
                  <label style={labelStyle}>YOUR NICHE</label>
                  <input value={postNiche} onChange={(e) => setPostNiche(e.target.value)} style={selectStyle} />
                </div>
                <div>
                  <label style={labelStyle}>TARGET KEYWORDS TO REINFORCE (COMMA SEPARATED)</label>
                  <input value={postKeywords} onChange={(e) => setPostKeywords(e.target.value)} placeholder="resume writer, professional resume writing services" style={selectStyle} />
                </div>

                {postTask === "create" && (
                  <div>
                    <label style={labelStyle}>PREFERRED FORMAT (OPTIONAL)</label>
                    <select value={postFormatPref} onChange={(e) => setPostFormatPref(e.target.value)} style={selectStyle}>
                      <option value="">Let it pick the best fit</option>
                      <option value="Before/after story">Before/after story</option>
                      <option value="Contrarian hot take">Contrarian hot take</option>
                      <option value="Curated list">Curated list</option>
                      <option value="Quantified result">Quantified result</option>
                    </select>
                  </div>
                )}

                <div style={{ display: "flex", gap: 10 }}>
                  <button onClick={() => setPostSourceMode("text")} style={{
                    flex: 1, padding: "8px 14px", borderRadius: 6, cursor: "pointer",
                    fontFamily: "'Courier New', monospace", fontSize: 12,
                    background: postSourceMode === "text" ? INK : "transparent", color: postSourceMode === "text" ? PAPER : INK,
                    border: `1px solid ${INK}`,
                  }}>Paste text</button>
                  <button onClick={() => setPostSourceMode("image")} style={{
                    flex: 1, padding: "8px 14px", borderRadius: 6, cursor: "pointer",
                    fontFamily: "'Courier New', monospace", fontSize: 12,
                    background: postSourceMode === "image" ? INK : "transparent", color: postSourceMode === "image" ? PAPER : INK,
                    border: `1px solid ${INK}`,
                  }}>Upload or paste image</button>
                </div>

                {postSourceMode === "text" && (
                  <div>
                    <label style={labelStyle}>{postTask === "rewrite" ? "ORIGINAL POST TEXT" : "TOPIC, STORY, OR CLIENT REVIEW"}</label>
                    <textarea
                      value={postSourceText}
                      onChange={(e) => setPostSourceText(e.target.value)}
                      placeholder={postTask === "rewrite" ? "Paste the full text of the viral post here..." : "Describe the topic or paste the client review/story..."}
                      style={{ ...selectStyle, minHeight: 100, fontFamily: "inherit", resize: "vertical" }}
                    />
                  </div>
                )}

                {postSourceMode === "image" && (
                  <div>
                    <label style={labelStyle}>SCREENSHOT OR PHOTO</label>
                    <input type="file" accept="image/png,image/jpeg,image/webp" onChange={(e) => loadPostImage(e.target.files[0])} style={{ fontFamily: "'Courier New', monospace", fontSize: 12 }} />
                    <div
                      tabIndex={0}
                      onPaste={(e) => {
                        const items = e.clipboardData ? e.clipboardData.items : [];
                        for (const item of items) {
                          if (item.type.indexOf("image") === 0) { loadPostImage(item.getAsFile()); e.preventDefault(); break; }
                        }
                      }}
                      style={{ marginTop: 8, border: "1px dashed #D8D0BC", borderRadius: 6, padding: 14, fontSize: 12, fontFamily: "'Courier New', monospace", color: "#8A8272", textAlign: "center", cursor: "text" }}
                    >
                      {postImagePreview ? "Image loaded \u2014 click and paste again to replace" : "Click here, then paste (Ctrl/Cmd+V) a copied image"}
                    </div>
                    {postImagePreview && <img src={postImagePreview} style={{ maxWidth: "100%", marginTop: 8, borderRadius: 6, border: "1px solid #D8D0BC" }} />}
                    {postTask === "create" && (
                      <textarea
                        value={postSourceText}
                        onChange={(e) => setPostSourceText(e.target.value)}
                        placeholder="Any notes about the photo (optional)..."
                        style={{ ...selectStyle, minHeight: 60, fontFamily: "inherit", resize: "vertical", marginTop: 10 }}
                      />
                    )}
                  </div>
                )}

                <div>
                  <label style={labelStyle}>{postTask === "rewrite" ? "POST LINK (OPTIONAL)" : "EXTRA CONTEXT (OPTIONAL)"}</label>
                  <input value={postContext} onChange={(e) => setPostContext(e.target.value)} placeholder={postTask === "rewrite" ? "https://linkedin.com/..." : "Anything else worth mentioning"} style={selectStyle} />
                </div>
              </div>

              <button
                onClick={runPostGenerate}
                disabled={postLoading}
                style={{
                  padding: "9px 16px", background: INK, color: PAPER, border: "none", borderRadius: 6,
                  fontFamily: "'Courier New', monospace", fontSize: 13, cursor: postLoading ? "default" : "pointer",
                  opacity: postLoading ? 0.6 : 1, marginBottom: 16,
                }}
              >
                {postLoading ? "Working..." : (postTask === "rewrite" ? "Analyze and rewrite" : "Generate post")}
              </button>

              {postError && <p style={{ color: RISK, fontSize: 12, fontFamily: "'Courier New', monospace" }}>{postError}</p>}

              {postResult && (
                <div>
                  <div style={{ marginBottom: 14, padding: "14px 16px", borderRadius: 6, background: INK }}>
                    <div style={{ color: BRASS, fontFamily: "'Courier New', monospace", fontSize: 11, marginBottom: 6, letterSpacing: 0.5 }}>DETECTED FORMAT</div>
                    <div style={{ color: PAPER, fontSize: 14, fontWeight: 700, marginBottom: 8 }}>{postResult.format}</div>
                    <div style={{ color: "#9AA3B0", fontSize: 12, lineHeight: 1.6 }}>{postResult.why}</div>
                    {postResult.keywordNote && <div style={{ color: "#9AA3B0", fontSize: 12, lineHeight: 1.6, marginTop: 6 }}>{postResult.keywordNote}</div>}
                  </div>
                  <div style={{ position: "relative" }}>
                    <div style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "18px 18px 16px", whiteSpace: "pre-wrap", fontSize: 14, lineHeight: 1.6, color: INK }}>
                      <div style={{ marginBottom: 10, color: "#8A8272", fontFamily: "'Courier New', monospace", fontSize: 11 }}>
                        {postTask === "rewrite" ? "REWRITTEN POST" : "NEW POST"}
                      </div>
                      {postResult.rewritten}
                    </div>
                    <button onClick={copyPostResult} style={{
                      marginTop: 12, padding: "9px 16px", background: postCopied ? SAFE : INK, color: PAPER, border: "none",
                      borderRadius: 6, fontFamily: "'Courier New', monospace", fontSize: 13, cursor: "pointer",
                    }}>{postCopied ? "Copied" : "Copy post"}</button>
                    <button onClick={runPostGenerate} disabled={postLoading} style={{
                      marginTop: 12, marginLeft: 10, padding: "9px 16px", background: "transparent", color: INK,
                      border: `1px solid ${INK}`, borderRadius: 6, fontFamily: "'Courier New', monospace", fontSize: 13, cursor: "pointer",
                    }}>Regenerate</button>
                  </div>
                </div>
              )}
            </div>
          )}

          {tab === "ranking" && (
            <div>
              <p style={{ fontSize: 13, color: "#5A5142", marginTop: 0, marginBottom: 18, fontFamily: "'Courier New', monospace" }}>
                A repeatable checklist for improving where your profile ranks in LinkedIn Services search.
              </p>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {RANKING_STEPS.map((s) => (
                  <div key={s.n} style={{ background: "#fff", border: "1px solid #D8D0BC", borderRadius: 6, padding: "14px 16px" }}>
                    <div style={{ display: "flex", gap: 10, alignItems: "baseline" }}>
                      <span style={{ color: BRASS, fontFamily: "'Courier New', monospace", fontSize: 12, fontWeight: 700 }}>{s.n}</span>
                      <div>
                        <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4 }}>{s.title}</div>
                        <div style={{ fontSize: 13, color: "#5A5142", lineHeight: 1.6 }}>{s.body}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
